; Motolux Blind Bridge (A-OK protocol) for ESP32 + CC1101
; Default target: classic ESP32 DevKit (HW-395, ESP32-WROOM-32, 38 pins, USB-C).

[platformio]
default_envs = hw395

[env]
platform = platformio/espressif32@6.12.0
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:tools/embed_ui.py
lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.2.0
  links2004/WebSockets@2.6.1

[env:hw395]
board = esp32dev
board_build.partitions = min_spiffs.csv

; Over-the-air update from PlatformIO once the bridge is on the network
[env:hw395_ota]
extends = env:hw395
upload_protocol = espota
upload_port = motolux-blinds.local

; ESP32-S3 boards (the upstream project's hardware)
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=1
  -DDEFAULT_PIN_SCK=12
  -DDEFAULT_PIN_MISO=13
  -DDEFAULT_PIN_MOSI=11
  -DDEFAULT_PIN_CS=10
  -DDEFAULT_PIN_GDO0=14
  -DDEFAULT_PIN_GDO2=9
  -DDEFAULT_PIN_LED=-1

; WT32-ETH01 (ESP32 + LAN8720 Ethernet). The CC1101 moves off the pins the
; Ethernet chip uses. Wi-Fi is optional: the setup Wi-Fi opens only when the
; cable has no network.
[env:wt32eth01]
board = wt32-eth01
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DUSE_ETH
  -DETH_PHY_TYPE=ETH_PHY_LAN8720
  -DETH_PHY_ADDR=1
  -DETH_PHY_MDC=23
  -DETH_PHY_MDIO=18
  -DETH_PHY_POWER=16
  -DETH_CLK_MODE=ETH_CLOCK_GPIO0_IN
  -DDEFAULT_PIN_SCK=14
  -DDEFAULT_PIN_MISO=35
  -DDEFAULT_PIN_MOSI=15
  -DDEFAULT_PIN_CS=4
  -DDEFAULT_PIN_GDO0=32
  -DDEFAULT_PIN_GDO2=33
  -DDEFAULT_PIN_LED=-1
